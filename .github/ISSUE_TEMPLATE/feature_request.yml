name: Feature request
description: Propose a portable workflow or setup improvement.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and concrete example
      description: Use fictional data only.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs
      description: Consider fidelity, compatibility, permissions, costs, privacy and recovery.
