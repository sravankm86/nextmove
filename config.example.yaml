# Filled copies stay private; Airtable Settings is authoritative configuration.
mode: review
timezone: null
storage:
  structured_provider: airtable
  content_provider: google_drive
  base: null
  schema_version: 2
  inventory_policy: admission-only
execution:
  default: single-agent
  pipeline: [Scan, Review, Prepare, Apply, Track]
  manual_handoffs: true
  one_active_writer: true
  continue_unaffected: true
role_gate:
  role_family: product_management
  experience_years_threshold: null
  comparison: greater_than
  equivalent_scope_benchmark: null
  recall_first: true
  title_only_admission: false
  career_screen_before_queue: true
scan:
  complete_source_enumeration: true
  description_policy: admission-focused
  recovery_budget: null
history:
  meaningful_changes: true
  run_read_scope: true
  per_read_rows: false
auto_apply:
  enabled: false
  supported_domains: []
  daily_submission_cap: 0
