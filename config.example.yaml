# Filled copies stay private; Airtable Settings is authoritative configuration.
mode: review
timezone: null
storage:
  structured_provider: airtable
  content_provider: google_drive
  base: null
  schema_version: 10
  inventory_policy: plausible-pm-candidates
execution:
  default: single-agent
  pipeline: [Scan, Review, Prepare, Apply, Track]
  manual_handoffs: true
  one_active_writer: true
  continue_unaffected: true
role_gate:
  role_family: product_management
  experience_years_threshold: null
  comparison: greater_than
  equivalent_scope_benchmark: null
  recall_first: true
  title_only_admission: false
  career_screen_before_queue: true
scan:
  complete_source_enumeration: true
  description_policy: candidate-focused
  inventory_gate: keywords_and_basic_semantics
  career_screen: false
review:
  owns_final_eligibility: true
  owns_career_screen: true
  queue_status: Queued
  disposition_feedback: true
scan_optimization:
  versioned_changes: true
  protect_eligible_recall: true
  career_rejections_are_scan_negatives: false
history:
  meaningful_changes: true
  run_read_scope: true
  per_read_rows: false
auto_apply:
  enabled: false
  supported_domains: []
  daily_submission_cap: 0
